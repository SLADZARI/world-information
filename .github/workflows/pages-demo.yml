name: Publish approved static demo (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check reviewed graph and build allow-listed site
        run: |
          node tools/sync_research_board.mjs --check
          node tools/check_research_board.mjs
          node tools/build_site.mjs
          node tools/check_public_demo.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
