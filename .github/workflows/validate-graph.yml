name: Graph integrity
on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/validate_graph.py"
      - ".github/workflows/validate-graph.yml"
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/validate_graph.py"
      - ".github/workflows/validate-graph.yml"

jobs:
  semantic-fixture-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_graph.py
      - run: python tools/validate_research.py
      - run: python -m unittest discover -s tests -p 'test_open_apis.py'
      - run: node tools/check_board.mjs
      - run: node tools/check_research_board.mjs
