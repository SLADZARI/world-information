name: Digital country catalog integrity
on:
  pull_request:
    paths:
      - "data/catalog/**"
      - "data/research/digital-ecosystems/**"
      - "schemas/digital-country-profile.schema.json"
      - "tools/build_digital_country_catalog.py"
      - "prototype/digital-country-catalog*"
      - "tests/test_digital_country_catalog.py"
      - ".github/workflows/validate-country-catalog.yml"
  push:
    paths:
      - "data/catalog/**"
      - "data/research/digital-ecosystems/**"
      - "schemas/digital-country-profile.schema.json"
      - "tools/build_digital_country_catalog.py"
      - "prototype/digital-country-catalog*"
      - "tests/test_digital_country_catalog.py"
      - ".github/workflows/validate-country-catalog.yml"
jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-linked staging
        run: python tools/validate_digital_ecosystem.py
      - name: Check reproducible catalog and offline HTML
        run: python tools/build_digital_country_catalog.py --check
      - name: Country catalog regression tests
        run: python -m unittest discover -s tests -p 'test_digital_country_catalog.py'
